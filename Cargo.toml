[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
repository = "https://github.com/cu-e/nocterm-contract"

[workspace.dependencies]
nocterm-hub-model = { path = "crates/hub-model" }
nocterm-hub-proto = { path = "crates/hub-proto" }
nocterm-hub-grpc = { path = "crates/hub-grpc" }
nocterm-hub-client = { path = "crates/hub-client" }
nocterm-keys = { path = "crates/keys" }
nocterm-link = { path = "crates/link" }

argon2 = { version = "0.6", features = ["zeroize"] }
base64 = "0.22"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
ed25519-dalek = { version = "3", features = ["zeroize"] }
getrandom = "0.4"
hex = "0.4"
hmac = "0.13"
hkdf = "0.13"
hyper-util = { version = "0.1", features = ["tokio"] }
http-body = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
protox = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = { version = "0.14", default-features = false, features = ["codegen", "transport"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
webpki-roots = "1"
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
too_many_lines = "warn"
cognitive_complexity = "warn"
unwrap_used = "warn"
expect_used = "warn"

# Argon2id at 64 MiB is too slow unoptimized for the key-derivation tests.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
