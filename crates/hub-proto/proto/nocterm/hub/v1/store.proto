syntax = "proto3";

package nocterm.hub.v1;

import "nocterm/hub/v1/common.proto";

// End-to-end encrypted collections. The hub stores and versions opaque ciphertext; it never
// holds a key that opens it. Names of collections are encrypted too.
//
// Change feeds: every collection is a stream with a head version. Each accepted write
// advances the head by exactly one inside the same transaction (no gaps, commit order).
// `WatchChanges` only hints that a head moved; clients read changes with `ListChanges`.
service StoreService {
  // Key material of the calling account, wrapped by a key only the user can derive.
  rpc GetAccountKeyset(GetAccountKeysetRequest) returns (AccountKeyset);
  rpc PutAccountKeyset(PutAccountKeysetRequest) returns (AccountKeyset);

  rpc CreateCollection(CreateCollectionRequest) returns (Collection);
  rpc ListCollections(ListCollectionsRequest) returns (CollectionList);
  rpc DeleteCollection(DeleteCollectionRequest) returns (Collection);
  // Collection key wrapped for the calling account: sealed by the account's own key for the
  // creator, or sealed to its public key when another account granted it.
  rpc GetCollectionKey(GetCollectionKeyRequest) returns (CollectionKey);
  // Stores a collection key sealed to another member's public key. Allowed to a holder of the
  // key who is an admin of the collection's organization; the recipient must be a member.
  rpc GrantCollectionKey(GrantCollectionKeyRequest) returns (Empty);
  // Members of the collection's organization (the owner for a personal collection) with the
  // public key they published and whether they already hold the collection key.
  rpc ListCollectionMembers(ListCollectionMembersRequest) returns (CollectionMemberList);

  rpc PutObject(PutObjectRequest) returns (ObjectVersion);
  rpc DeleteObject(DeleteObjectRequest) returns (ObjectVersion);
  rpc GetObject(GetObjectRequest) returns (StoredObject);
  rpc ListChanges(ListChangesRequest) returns (ChangeBatch);
  rpc WatchChanges(WatchChangesRequest) returns (stream ChangeHint);
}

message GetAccountKeysetRequest {}

// Where the unlock key that wraps the account key comes from. The client reads it to choose
// how to derive the key; a password for the wrong source cannot open the keyset.
enum UnlockKind {
  // A keyset written before this field existed; the client cannot tell and reports it.
  UNLOCK_KIND_UNSPECIFIED = 0;
  // Derived from the account's login password (`login-v1`): the salt comes from the hub's
  // identifier and the user name, the parameters are fixed. The client ignores `kdf` and
  // `salt` of the keyset.
  UNLOCK_KIND_LOGIN_PASSWORD = 1;
  // Derived from a separate vault password with the `kdf` and `salt` of the keyset (accounts
  // that sign in through an identity provider, or that keep a vault password of their own).
  UNLOCK_KIND_VAULT_PASSWORD = 2;
}

message AccountKeyset {
  // 0 when the account has no keyset yet.
  uint64 version = 1;
  // Public KDF description, for example "argon2id;m=65536;t=3;p=4".
  string kdf = 2;
  bytes salt = 3;
  // Account key wrapped by the user's unlock key (sealed by the client).
  bytes wrapped_account_key = 4;
  int64 updated_at_ms = 5;
  // X25519 public key of the account, published so others can grant it collection keys.
  bytes public_key = 6;
  // The matching private key, sealed by the account key.
  bytes sealed_private_key = 7;
  // The account key sealed by the recovery key.
  bytes recovery_wrapped_account_key = 8;
  // How the unlock key of `wrapped_account_key` is derived.
  UnlockKind unlock_kind = 9;
}

message PutAccountKeysetRequest {
  // Version the client last saw; 0 creates the keyset.
  uint64 expected_version = 1;
  string kdf = 2;
  bytes salt = 3;
  bytes wrapped_account_key = 4;
  bytes public_key = 5;
  bytes sealed_private_key = 6;
  bytes recovery_wrapped_account_key = 7;
  // How the unlock key of `wrapped_account_key` was derived; the hub stores it as given.
  UnlockKind unlock_kind = 8;
}

message Collection {
  string collection_id = 1;
  // Empty for personal collections.
  string org_id = 2;
  bool personal = 3;
  // Client-defined type, for example "vault" or "profiles".
  string kind = 4;
  bytes sealed_name = 5;
  uint64 head = 6;
  int64 created_at_ms = 7;
  bool deleted = 8;
}

message CreateCollectionRequest {
  // Empty creates a personal collection of the caller.
  string org_id = 1;
  string kind = 2;
  bytes sealed_name = 3;
  // Collection key wrapped for the creator.
  bytes wrapped_key = 4;
  // Client-chosen identifier so the client can bind it into encrypted data beforehand.
  string collection_id = 5;
}

message ListCollectionsRequest {
  // Empty lists the caller's personal collections and those of every org they belong to.
  string org_id = 1;
  string kind = 2;
}

message CollectionList {
  repeated Collection collections = 1;
}

message DeleteCollectionRequest {
  string collection_id = 1;
}

message GetCollectionKeyRequest {
  string collection_id = 1;
}

message CollectionKey {
  string collection_id = 1;
  uint64 key_version = 2;
  bytes wrapped_key = 3;
  // The account that granted the key to the caller; empty for the caller's own envelope. The
  // hub records it when it stores a grant. It only tells the client whose pinned public key
  // to try: a grant opens only under the key of the account that made it, so a wrong or
  // forged value yields an error, not a key.
  string granted_by = 4;
}

message GrantCollectionKeyRequest {
  string collection_id = 1;
  // The member who receives the key.
  string account_id = 2;
  // The collection key sealed from the granter's key pair to the recipient's public key, bound
  // to this collection, this account and the granter's key. The hub stores it as given and
  // records the caller as `granted_by`.
  bytes sealed_key = 3;
}

message ListCollectionMembersRequest {
  string collection_id = 1;
}

message CollectionMember {
  string account_id = 1;
  string username = 2;
  string display_name = 3;
  Role role = 4;
  // Empty until the account has created its keyset.
  bytes public_key = 5;
  // Whether the account holds a key envelope of this collection.
  bool has_key = 6;
}

message CollectionMemberList {
  repeated CollectionMember members = 1;
}

message PutObjectRequest {
  string collection_id = 1;
  string object_id = 2;
  // 0 creates the object; otherwise the current version, or the write fails with CONFLICT.
  uint64 expected_version = 3;
  string kind = 4;
  bytes ciphertext = 5;
}

message DeleteObjectRequest {
  string collection_id = 1;
  string object_id = 2;
  uint64 expected_version = 3;
}

message GetObjectRequest {
  string collection_id = 1;
  string object_id = 2;
}

message ObjectVersion {
  string collection_id = 1;
  string object_id = 2;
  uint64 version = 3;
  // Head of the collection stream after the write.
  uint64 stream_version = 4;
}

message StoredObject {
  string collection_id = 1;
  string object_id = 2;
  uint64 version = 3;
  string kind = 4;
  // Empty for a deleted object (tombstone).
  bytes ciphertext = 5;
  bool deleted = 6;
  int64 updated_at_ms = 7;
  string updated_by_device = 8;
  uint64 stream_version = 9;
}

message ListChangesRequest {
  string collection_id = 1;
  // Stream version the client has; changes after it are returned.
  uint64 after = 2;
  uint32 limit = 3;
}

message ChangeBatch {
  repeated StoredObject changes = 1;
  uint64 head = 2;
  bool more = 3;
}

message WatchChangesRequest {
  repeated string collection_ids = 1;
}

message ChangeHint {
  string collection_id = 1;
  uint64 head = 2;
}
