syntax = "proto3";

package nocterm.hub.v1;

import "nocterm/hub/v1/common.proto";

// A byte stream to a TCP endpoint, opened by the hub or by one of its nodes on the caller's
// behalf. It carries the first hop of an SSH route: the hub sees the target address, when
// the stream opened and how much it carried, never what is inside. Needs an access token.
service RelayService {
  // The first frame of the request stream must be `open`. The hub answers `opened` once the
  // connection is established, or `closed` with the reason it was refused.
  //
  // Data frames carry 1 to 32 KiB. An empty `data` frame is not sent and is ignored when
  // received: the end of the bytes is only ever `close` or `closed`, never a short read.
  //
  // The two directions end differently:
  //   * The caller's `close` is a half-close. The target receives end-of-file and may still
  //     answer; the relay lives on until `closed`. A request stream that ends without `close`
  //     is an abort: the hub drops the connection to the target.
  //   * `closed` from the hub ends the whole relay, whether the target closed its side
  //     (code unspecified) or the relay failed (any other code). Nothing follows it and the
  //     hub discards any `data` or `close` that arrives afterwards, so a caller that has seen
  //     `closed` stops writing. A target that closes only its own direction while the caller
  //     may still write is not representable: it ends the relay.
  rpc Open(stream RelayUp) returns (stream RelayDown);
}

message RelayUp {
  oneof frame {
    RelayOpen open = 1;
    // Bytes for the target; never empty.
    bytes data = 2;
    // The caller sends no more bytes (half-close); the target may still answer until `closed`.
    RelayClose close = 3;
  }
}

message RelayDown {
  oneof frame {
    RelayOpened opened = 1;
    // Bytes from the target; never empty (an empty frame is ignored by the receiver).
    bytes data = 2;
    // Ends the whole relay, in both directions; nothing follows.
    RelayClosed closed = 3;
  }
}

message RelayOpen {
  string host = 1;
  uint32 port = 2;
  // Node that dials the target from inside its network. Empty: the hub dials.
  string node = 3;
}

message RelayClose {}

message RelayOpened {
  // The address the hub or node connected to, as an IP literal.
  string peer_ip = 1;
}

message RelayClosed {
  // Unspecified for an ordinary end of the stream. Otherwise why it ended: RELAY_DENIED
  // (the egress policy or the account's rights refuse the target), RELAY_LIMIT (a limit of
  // the hub is reached), NODE_UNAVAILABLE (the node is offline or refused).
  ErrorCode code = 1;
  // Human-readable detail, for display only.
  string message = 2;
}
